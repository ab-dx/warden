name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  # the same image build compose runs, so a broken .dockerignore or lockfile fails here
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - api
          - edge-gateway
          - guard-worker
          - judge-service
          - ledger-service
          - ops-agent
          - paypal-connector
          - policy-service
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg APP=${{ matrix.app }} -t warden-${{ matrix.app }}:ci .
