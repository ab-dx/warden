name: warden

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 5s
  retries: 30

# shared by every warden service. secrets come from .env (pnpm setup:env fills them)
x-infra: &infra
  postgres: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }
  temporal: { condition: service_healthy }

x-app: &app
  profiles: [app]
  env_file: [.env]
  restart: unless-stopped
  depends_on: *infra

# service addresses inside the compose network, overriding the localhost defaults
x-internal: &internal
  KAFKA_BROKERS: kafka:9092
  TEMPORAL_ADDRESS: temporal:7233
  POLICY_URL: http://policy-service:7003
  CONNECTOR_URL: http://paypal-connector:7001
  LEDGER_URL: http://ledger-service:7004
  # GUARD_JUDGE_URL= (set and empty) runs payments through policy alone
  JUDGE_URL: ${GUARD_JUDGE_URL-http://judge-service:7006}
  # traces to jaeger, metrics to prometheus (the obs profile); unset either to turn it off
  NODE_OPTIONS: --import @warden/service-kit/telemetry
  OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_TRACES_ENDPOINT-http://jaeger:4318/v1/traces}
  OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${OTEL_METRICS_ENDPOINT-http://prometheus:9090/api/v1/otlp/v1/metrics}

services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-warden}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-warden}
    command: ["postgres", "-c", "wal_level=logical"]
    ports: ["5432:5432"]
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/compose/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "pg_isready", "-U", "warden"]

  kafka:
    image: apache/kafka:4.4.0
    environment:
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # topics are created explicitly by kafka-init so a typo can't spawn a new one
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports: ["29092:29092"]
    volumes:
      - kafka:/var/lib/kafka/data
    healthcheck:
      <<: *healthcheck
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null",
        ]

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka: { condition: service_healthy }
    volumes:
      - ./deploy/compose/kafka:/init:ro
    entrypoint: ["/bin/bash", "/init/create-topics.sh"]
    restart: "no"

  temporal:
    image: temporalio/temporal:1.9.1
    command:
      ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports: ["7233:7233", "8233:8233"]
    volumes:
      # mounted over the image home dir so the volume inherits the non-root owner
      - temporal:/home/temporal
    healthcheck:
      <<: *healthcheck
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]

  jaeger:
    image: jaegertracing/jaeger:2.22.0
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  # metrics and dashboards: docker compose --profile app --profile obs up -d
  # grafana on http://localhost:3000, prometheus on http://localhost:9090, both local only
  prometheus:
    image: prom/prometheus:v3.16.0
    profiles: [obs]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-otlp-receiver"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:13.3.0
    profiles: [obs]
    environment:
      # a local tool: open straight to the dashboard as a viewer
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/warden.json
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./deploy/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/compose/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on: [prometheus]

  # optional local model for the demo agent: docker compose --profile llm up -d ollama
  ollama:
    image: ollama/ollama:0.40.14
    profiles: [llm]
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama

  # the warden services: docker compose --profile app up -d --build
  policy-service:
    <<: *app
    build: { context: ., args: { APP: policy-service } }
    environment:
      <<: *internal
      POLICY_DATABASE_URL: postgres://policy:${SERVICE_DB_PASSWORD:-warden}@postgres:5432/policy
      POLICY_FILE: /app/policy.yaml
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7003/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  paypal-connector:
    <<: *app
    build: { context: ., args: { APP: paypal-connector } }
    environment:
      <<: *internal
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7001/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  guard-worker:
    <<: *app
    build: { context: ., args: { APP: guard-worker } }
    environment:
      <<: *internal
      GUARD_DATABASE_URL: postgres://guard:${SERVICE_DB_PASSWORD:-warden}@postgres:5432/guard
    depends_on:
      <<: *infra
      policy-service: { condition: service_healthy }
      paypal-connector: { condition: service_healthy }
      judge-service: { condition: service_healthy }
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7002/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  edge-gateway:
    <<: *app
    build: { context: ., args: { APP: edge-gateway } }
    ports: ["7000:7000"]
    environment:
      <<: *internal
      GATEWAY_DATABASE_URL: postgres://gateway:${SERVICE_DB_PASSWORD:-warden}@postgres:5432/gateway
      DASHBOARD_URL: http://localhost:7005
      UNTRUSTED_MCP_URLS: http://inbox:7010/mcp
    depends_on:
      <<: *infra
      guard-worker: { condition: service_healthy }
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  judge-service:
    <<: *app
    build: { context: ., args: { APP: judge-service } }
    environment:
      <<: *internal
      JUDGE_DATABASE_URL: postgres://judge:${SERVICE_DB_PASSWORD:-warden}@postgres:5432/judge
      # JUDGE_LLM_BASE_URL= (set and empty) keeps only the provenance check
      JUDGE_LLM_BASE_URL: ${JUDGE_LLM_BASE_URL-}
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7006/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  # the demo agent's mailbox. the agent reaches it through the gateway
  inbox:
    <<: *app
    build: { context: ., args: { APP: ops-agent } }
    command: ["dist/inbox-server.js"]
    # its mailbox can be swapped over http, so keep it on this machine
    ports: ["127.0.0.1:7010:7010"]
    environment:
      SEED_FILE: /seed/sandbox.json
    volumes: ["./.seed:/seed:ro"]
    depends_on: {}

  ledger-service:
    <<: *app
    build: { context: ., args: { APP: ledger-service } }
    environment:
      <<: *internal
      LEDGER_DATABASE_URL: postgres://ledger:${SERVICE_DB_PASSWORD:-warden}@postgres:5432/ledger
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7004/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

  api:
    <<: *app
    build: { context: ., args: { APP: api } }
    ports: ["7005:7005"]
    environment:
      <<: *internal
      DASHBOARD_DIR: /app/dashboard
      PASSKEY_FILE: /home/nonroot/passkey.json
    # the owner's passkey; mounted on the non-root home so the volume starts out writable
    volumes:
      - api:/home/nonroot
    depends_on:
      <<: *infra
      policy-service: { condition: service_healthy }
      ledger-service: { condition: service_healthy }
    healthcheck:
      {
        <<: *healthcheck,
        test:
          [
            "CMD",
            "/nodejs/bin/node",
            "-e",
            "fetch('http://localhost:7005/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
          ],
      }

volumes:
  api:
  prometheus:
  ollama:
  postgres:
  kafka:
  temporal:
