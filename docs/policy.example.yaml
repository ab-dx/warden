# limits per agent. a mandate from the user narrows these further for a task.
agents:
  ops-agent:
    # tiers: T0 read, T1 write without money, T2 commits a customer, T3 money out
    require_mandate_for: [T2, T3]
    max_per_call: { value: "150.00", currency: USD }
    daily_budget: { value: "500.00", currency: USD }
    velocity: { max_calls: 6, per_seconds: 60, tiers: [T3] }
    duplicate_window_seconds: 300
    # payments to one payee in this window are added up against the mandate's per-payment cap
    split_window_seconds: 3600
    # held payments per hour before the rest are refused, so the owner isn't worn down
    max_escalations_per_hour: 10
    # a first payment to a payee the user didn't name goes to the user, at any amount
    new_payee_review_above: { value: "0.00", currency: USD }
    # money only moves in these hours (off here, since demos run at any time):
    # allowed_hours: { from: "09:00", to: "18:00", timezone: Asia/Kolkata, tiers: [T3] }
    deny_counterparties: ["*@temp-mail.org", "*@guerrillamail.com"]
    # these reasons go to the user for a decision; any other reason denies outright
    escalate_when:
      - NO_MANDATE
      - COUNTERPARTY_NOT_IN_MANDATE
      - OVER_MANDATE_PER_CALL_CAP
      - OVER_MANDATE_TOTAL
      - SPLIT_PAYMENT
      - NEW_PAYEE
  # the benchmark harness, same limits so its numbers describe the demo agent
  bench-agent:
    # tiers: T0 read, T1 write without money, T2 commits a customer, T3 money out
    require_mandate_for: [T2, T3]
    max_per_call: { value: "150.00", currency: USD }
    daily_budget: { value: "500.00", currency: USD }
    velocity: { max_calls: 6, per_seconds: 60, tiers: [T3] }
    duplicate_window_seconds: 300
    # payments to one payee in this window are added up against the mandate's per-payment cap
    split_window_seconds: 3600
    # held payments per hour before the rest are refused, so the owner isn't worn down
    max_escalations_per_hour: 10
    # a first payment to a payee the user didn't name goes to the user, at any amount
    new_payee_review_above: { value: "0.00", currency: USD }
    deny_counterparties: ["*@temp-mail.org", "*@guerrillamail.com"]
    # these reasons go to the user for a decision; any other reason denies outright
    escalate_when:
      - NO_MANDATE
      - COUNTERPARTY_NOT_IN_MANDATE
      - OVER_MANDATE_PER_CALL_CAP
      - OVER_MANDATE_TOTAL
      - SPLIT_PAYMENT
      - NEW_PAYEE
  # the attack lab on the dashboard: anyone signed in writes the email it reads
  lab-agent:
    require_mandate_for: [T2, T3]
    max_per_call: { value: "150.00", currency: USD }
    # high, so repeated lab runs show the redirect being caught, not the budget running out;
    # the mandate still caps each payment at $150 and only its payee is paid unattended
    daily_budget: { value: "5000.00", currency: USD }
    velocity: { max_calls: 6, per_seconds: 60, tiers: [T3] }
    duplicate_window_seconds: 60
    split_window_seconds: 3600
    max_escalations_per_hour: 30
    new_payee_review_above: { value: "0.00", currency: USD }
    deny_counterparties: ["*@temp-mail.org", "*@guerrillamail.com"]
    escalate_when:
      - NO_MANDATE
      - COUNTERPARTY_NOT_IN_MANDATE
      - OVER_MANDATE_PER_CALL_CAP
      - OVER_MANDATE_TOTAL
      - SPLIT_PAYMENT
      - NEW_PAYEE
